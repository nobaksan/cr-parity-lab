# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  poem: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  auto_approvals:
    enabled: true
    max_merge_risk: high
    overrides:
      - paths:
          - "docs/**"
        max_merge_risk: moderate
      - paths:
          - "**/*.md"
        max_merge_risk: low
